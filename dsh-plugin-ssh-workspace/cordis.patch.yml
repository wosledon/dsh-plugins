# 「SSH 远程工作区」bundle 的补丁层。
#
# **必须插入宿主条目行**，否则宿主半根本不会被加载（`apply()` 永远不会跑，
# 工具也就永远不会注册）。一度以为"装进 profile 就够了"，那是错的：
# bundle 只是把包放进 profile，真正让宿主半生效的是这一行 insert。
#
# 浏览器半不由补丁声明：`dsh-client-modules` 扫描已启用 Loader 条目的
# package.json `dsh.client` 声明，并通过 `exports["./client"]` 取得浏览器
# bundle，所以 client.js 会自动进入 window.__DSH_BOOT__。
#
# 行 id 在 profile 内必须唯一，同时它也是本插件的**设置命名空间**：
#   - 客户端写主机列表用 `remote.settings.mutate('ssh-workspace', …)`
#   - 宿主半 `lib/store.js` 的 `locateEntry()` 按 id 找自己的行
# 三处必须一致，改名要一起改。
- insert:
    - id: ssh-workspace
      name: 'dsh-plugin-ssh-workspace'
