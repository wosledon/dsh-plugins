<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="SSH remote workspace">
  <!--
    图标是美术资源，用字面颜色（官方规则：主题令牌用于界面，字面色仅用于美术）。
    配色与其它两个插件同一套官方色：主色品牌蓝 #4D6BFE，辅色琥珀 #F5A524。
    造型取"终端窗口 + 提示符"：窗口轮廓与提示符是蓝色，右上角的状态点用琥珀色
    点出"这是一条通向远端的连接"。
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <rect x="2.5" y="4" width="19" height="16" rx="3" stroke="#4D6BFE" />
    <path d="M2.5 8.5h19" stroke="#4D6BFE" />
    <path d="M6.5 12.2l2.4 2.4-2.4 2.4" stroke="#F5A524" />
    <path d="M11.6 17.4h5.6" stroke="#4D6BFE" />
  </g>
</svg>
