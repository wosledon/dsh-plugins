<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Reasoning effort">
  <!--
    图标是**美术资源**，可以用字面颜色（官方规则：主题令牌用于界面，字面色仅用于美术）。
    配色对齐官方图标集：主色品牌蓝 #4D6BFE，辅色琥珀 #F5A524。
    三根柱逐级升高表达"强度等级"，最高一根用辅色点出"最高档"。
  -->
  <g fill="none" stroke-linecap="round" stroke-width="2.6">
    <path d="M5 19.5V15" stroke="#4D6BFE" />
    <path d="M12 19.5V10.5" stroke="#4D6BFE" />
    <path d="M19 19.5V6" stroke="#F5A524" />
  </g>
</svg>
